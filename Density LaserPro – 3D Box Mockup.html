<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Density LaserPro – 3D Box Mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#ece8e1;--fg:#2b2822;--mut:#7a7468;--chip:#fff;--bd:#d6d0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--k:.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#efebe3;--mut:#9b9487;--chip:#2a2824;--bd:#3d3a34}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#efebe3;--mut:#9b9487;--chip:#2a2824;--bd:#3d3a34}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 18px 0;text-align:center}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.04em}
header p{margin:2px 0 0;color:var(--mut);font-size:12px}
#stage{flex:1;min-height:0;position:relative;perspective:2200px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}
#stage:active{cursor:grabbing}
#shadow{position:absolute;bottom:6%;width:min(60vw,360px);height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);filter:blur(4px)}
#box{position:relative;width:298px;height:801px;transform-style:preserve-3d;transform:scale(var(--k)) rotateX(-12deg) rotateY(-28deg)}
#box.anim{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.f{position:absolute;left:50%;top:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fffdf3}
.f img{display:block;width:100%;height:100%;-webkit-user-drag:none;pointer-events:none}
.front{width:298px;height:801px;margin:-400.5px 0 0 -149px;transform:translateZ(78px)}
.back{width:298px;height:801px;margin:-400.5px 0 0 -149px;transform:rotateY(180deg) translateZ(78px);background:rgb(197,160,84)}
.right{width:156px;height:801px;margin:-400.5px 0 0 -78px;transform:rotateY(90deg) translateZ(149px)}
.left{width:156px;height:801px;margin:-400.5px 0 0 -78px;transform:rotateY(-90deg) translateZ(149px)}
.top{width:298px;height:156px;margin:-78px 0 0 -149px;transform:rotateX(90deg) translateZ(400.5px)}
.bottom{width:298px;height:156px;margin:-78px 0 0 -149px;transform:rotateX(-90deg) translateZ(400.5px)}
.back img{position:absolute;left:50%;top:50%;width:801px;height:298px;object-fit:contain;transform:translate(-50%,-50%) rotate(90deg)}
.back.alt img{transform:translate(-50%,-50%) rotate(-90deg)}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 12px 16px}
button{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--bd);border-radius:999px;padding:6px 13px;cursor:pointer}
button:hover{border-color:var(--mut)}button.on{background:var(--fg);color:var(--bg)}
</style></head><body>

<script>
var box=document.getElementById('box'),st=document.getElementById('stage'),rx=-12,ry=-28,z=1,spin=false,drag=false,lx=0,ly=0,pts={},pd=0;
function fit(){var r=st.getBoundingClientRect();document.documentElement.style.setProperty('--k',Math.min(r.height*.74/801,r.width*.8/430)*z)}
function ap(){box.style.transform='scale(var(--k)) rotateX('+rx+'deg) rotateY('+ry+'deg)'}
function go(a,b,anim){box.classList.toggle('anim',!!anim);var d=Math.round((ry-b)/360);ry=b+d*360;rx=a;ap()}
st.addEventListener('pointerdown',function(e){pts[e.pointerId]=e;drag=true;lx=e.clientX;ly=e.clientY;box.classList.remove('anim');st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]=e;var k=Object.keys(pts);
if(k.length==2){var d=Math.hypot(pts[k[0]].clientX-pts[k[1]].clientX,pts[k[0]].clientY-pts[k[1]].clientY);if(pd){z=Math.max(.5,Math.min(2.5,z*d/pd));fit()}pd=d;return}
ry+=(e.clientX-lx)*.5;rx=Math.max(-90,Math.min(90,rx-(e.clientY-ly)*.5));lx=e.clientX;ly=e.clientY;ap()});
function up(e){delete pts[e.pointerId];pd=0}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
st.addEventListener('wheel',function(e){e.preventDefault();z=Math.max(.5,Math.min(2.5,z*(e.deltaY<0?1.08:.92)));fit()},{passive:false});
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){spin=false;sp.classList.remove('on');var v=b.dataset.v.split(',');go(+v[0],+v[1],true)}});
var sp=document.getElementById('spin');sp.onclick=function(){spin=!spin;sp.classList.toggle('on',spin)};
document.getElementById('flip').onclick=function(){document.getElementById('bk').classList.toggle('alt')};
document.getElementById('reset').onclick=function(){spin=false;sp.classList.remove('on');z=1;fit();go(-12,-28,true)};
(function t(){if(spin&&!drag){ry+=.4;ap()}requestAnimationFrame(t)})();
st.addEventListener('pointerdown',function(){drag=true});st.addEventListener('pointerup',function(){drag=false});
window.addEventListener('resize',fit);fit();ap();
</script></body></html>
